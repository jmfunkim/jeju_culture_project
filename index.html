const items = DATA.items;
const categories = [...new Set(items.map(i => i.category))];
const colorOf = Object.fromEntries(categories.map((c, i) => [c, `var(--c${(i % 4) + 1})`]));
const filters = document.getElementById('filters');
const grid = document.getElementById('grid');
const status = document.getElementById('status');

document.getElementById('intro').textContent =
  `${DATA.region}의 ${DATA.topic} ${items.length}가지를 분류별로 살펴보세요.`;

function el(tag, props = {}, text) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (text !== undefined) e.textContent = text;
  return e;
}

const q = document.getElementById('q');
const clear = document.getElementById('clear');
let current = '전체';

function render() {
  const query = q.value.trim().toLowerCase();
  const list = items.filter(i =>
    (current === '전체' || i.category === current) &&
    (!query || `${i.name} ${i.description} ${i.category}`.toLowerCase().includes(query)));

  if (list.length) {
    grid.replaceChildren(...list.map(i => {
      const card = el('article', { className: 'card' });
      card.style.setProperty('--tag', colorOf[i.category]);
      card.append(el('span', { className: 'tag' }, i.category), el('h2', {}, i.name), el('p', {}, i.description));
      return card;
    }));
  } else {
    const box = el('div', { className: 'empty', role: 'alert' });
    box.append(
      el('strong', {}, '검색 결과가 없습니다'),
      el('span', {}, query ? `"${q.value.trim()}"에 해당하는 정보가 없어요. 다른 검색어나 분류를 선택해 보세요.` : '표시할 정보가 없습니다.'));
    grid.replaceChildren(box);
  }
  status.textContent = `${current}${query ? ` · "${q.value.trim()}"` : ''} · ${list.length}개`;
  clear.hidden = !q.value;
  filters.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.cat === current)));
}

q.addEventListener('input', render);
document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); render(); });
clear.addEventListener('click', () => { q.value = ''; q.focus(); render(); });

['전체', ...categories].forEach(cat => {
  const count = cat === '전체' ? items.length : items.filter(i => i.category === cat).length;
  const b = el('button', { type: 'button' }, cat);
  b.dataset.cat = cat;
  b.append(el('span', { className: 'n' }, count));
  b.addEventListener('click', () => { current = cat; render(); });
  filters.append(b);
});

render();
</script>
